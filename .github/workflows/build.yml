name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      is-release:
        description: 'Publish release to CurseForge, GitHub and Maven'
        required: false
        default: false
        type: boolean
      dry-run:
        description: 'Validate the release without publishing'
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        run: echo "JAVA_HOME=$JAVA_HOME_25_X64" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: ${{ inputs.is-release }}
          cache-read-only: false

      - name: Data Generation
        run: ./gradlew runData

      - name: Build
        run: ./gradlew build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-jars
          path: |
            build/libs/*.jar
          if-no-files-found: error
          retention-days: 1
